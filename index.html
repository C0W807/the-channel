<style>
/* Layout: a dark prototype bar and story strip sit over three role workspaces (Sales desktop, the head chef's phone, Ops desktop).
   Ondo's thin rectangle frame is the recurring motif: inset hairline frames on the cards that matter. Single light world, as the brand is black on white. */
:root {
  --canvas: #F3F2EF;
  --paper: #FFFFFF;
  --wash: #F8F7F4;
  --ink: #111111;
  --ink-2: #3D3C39;
  --muted: #6B6963;
  --line: #E4E2DD;
  --line-2: #CDCAC3;
  --yes: #111111;
  --yes-wash: #ECEAE5;
  --if: #9A5800;
  --if-wash: #F7ECDA;
  --no: #AD2F27;
  --no-wash: #F7E3E0;
  --bar-base: #CBC7BF;
  --teal: #0E7C76;
  --teal-2: #14988F;
  --teal-deep: #0A4D49;
  --teal-light: #9ADCD3;
  --teal-wash: #E2F3F0;
  --teal-ink: #08504C;
  --f-ui: "Jost", "Futura", "Century Gothic", "Avenir Next", system-ui, sans-serif;
  --f-display: "Cormorant Garamond", "Cormorant", Garamond, Georgia, serif;
  --f-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
  --shadow: 0 1px 2px rgba(17,17,17,.05), 0 12px 32px rgba(17,17,17,.07);
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal-2); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font: 500 11px/1.4 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.display { font-family: var(--f-display); font-weight: 600; letter-spacing: -.005em; text-wrap: balance; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.logo-sm { --s: .34; }
.logo-xs { --s: .25; }
.logo-lg { --s: .92; }
.logo-inv { --s: .3; filter: invert(1); mix-blend-mode: screen; }
.proto-brand { display: flex; align-items: center; gap: 10px; }
.proto-brand .rule { width: 1px; height: 26px; background: rgba(243,242,239,.25); }
.proto-actions { display: flex; gap: 8px; }

/* ---------- Welcome ---------- */
.intro-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 20px 16px; background: rgba(17,17,17,.5); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); overflow-y: auto; animation: fade .3s ease; }
.intro-card { position: relative; width: 100%; max-width: 580px; background: var(--paper); border-radius: 22px; padding: 40px 40px 30px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; box-shadow: 0 40px 90px -30px rgba(0,0,0,.5); margin: auto; }
.intro-card::after { content: ""; position: absolute; inset: 9px; border: 1px solid var(--teal); border-radius: 15px; pointer-events: none; }
.intro-card h1 { font-size: 56px; line-height: .95; }
.intro-card .accent { color: var(--teal); font-style: italic; }
.intro-lede { font-size: 16.5px; line-height: 1.5; color: var(--ink-2); max-width: 46ch; }
.intro-roles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; margin-top: 6px; text-align: left; }
.intro-roles li { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: var(--wash); }
.intro-roles b { display: block; font-weight: 500; font-size: 14.5px; }
.intro-roles span.s { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.intro-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 8px; position: relative; z-index: 1; }
.intro-foot { font-size: 12.5px; margin-top: 4px; }

/* ---------- Guided tour highlight ---------- */
.coach { position: relative; z-index: 2; animation: coach 1.8s ease-out infinite; outline: 2px solid var(--teal-2) !important; outline-offset: 3px; }
@keyframes coach { 0% { box-shadow: 0 0 0 0 rgba(19,137,127,.5); } 70% { box-shadow: 0 0 0 12px rgba(19,137,127,0); } 100% { box-shadow: 0 0 0 0 rgba(19,137,127,0); } }

/* ---------- Motion ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise-in { from { opacity: .35; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes slide-in { from { opacity: .35; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.enter { animation: rise-in .38s cubic-bezier(.2,.7,.2,1); }
.enter-ph > * { animation: slide-in .32s cubic-bezier(.2,.7,.2,1); }
.btn, .btn-ghost, .chip, .opt, .ans-btn, .fix, .item, .link-card { transition: transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease; }
.btn:active, .btn-ghost:active, .chip:active, .opt:active, .ans-btn:active, .link-card:active { transform: scale(.98); }

/* ---------- Story progress ---------- */
.story { position: relative; }
.story-bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: transparent; }
.story-bar i { display: block; height: 2px; background: var(--teal-2); transition: width .5s ease; }

/* ---------- Signal tags ---------- */
.sig-tag { align-self: flex-start; font: 500 10px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; padding: 4px 7px; border-radius: 999px; margin-bottom: 3px; }
.sig-tag.risk { background: var(--no-wash); color: var(--no); }
.sig-tag.opp { background: var(--teal-wash); color: var(--teal); }
.sig-tag.watch { background: var(--if-wash); color: var(--if); }
@media (max-width: 620px) {
  .intro-card { padding: 32px 22px 24px; }
  .intro-card h1 { font-size: 44px; }
  .intro-roles { grid-template-columns: minmax(0, 1fr); }
}

/* ---------- Prototype bar ---------- */
.proto { background: var(--teal-deep); color: #F3F2EF; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 10px 20px; }
.proto-l { display: flex; align-items: center; gap: 12px; }
.proto-tag { font: 500 10.5px/1 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; border: 1px solid rgba(243,242,239,.35); border-radius: 4px; padding: 5px 7px; }
.proto-name { font-weight: 500; letter-spacing: .02em; }
.roles { display: flex; gap: 4px; background: rgba(255,255,255,.08); border-radius: 12px; padding: 4px; margin-inline: auto; }
.role { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; color: #D7ECE9; padding: 6px 14px 6px 6px; border-radius: 9px; text-align: left; }
.role b { display: block; font-weight: 500; font-size: 14px; line-height: 1.1; }
.role small { display: block; font-size: 12px; color: #9C9993; line-height: 1.2; }
.role[aria-pressed="true"] { background: #F3F2EF; color: var(--ink); }
.role[aria-pressed="true"] small { color: var(--muted); }
.av { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; background: #E9E7E2; color: var(--ink); }
.role .av { background: rgba(255,255,255,.14); color: #F3F2EF; }
.role small { color: #A9CFCA; }
.role[aria-pressed="true"] .av { background: var(--teal); color: #F3F2EF; }
.av-chef { background: var(--teal-deep); color: #F3F2EF; }
.av-ops { background: #DCD8CF; color: var(--ink); }
.proto-reset { border: 1px solid rgba(243,242,239,.3); background: transparent; color: #F3F2EF; border-radius: 9px; padding: 8px 13px; font-size: 13.5px; }
.proto-reset:hover { background: rgba(255,255,255,.1); }

/* ---------- Story strip ---------- */
.story { background: var(--paper); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 10px 20px; }
.steps-wrap { overflow-x: auto; max-width: 100%; }
.steps { display: flex; gap: 2px; min-width: max-content; }
.step { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 7px 10px; border-radius: 9px; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.step:hover { background: var(--wash); }
.step .dot { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-2); display: inline-flex; align-items: center; justify-content: center; font: 500 11.5px var(--f-mono); color: var(--muted); background: var(--paper); }
.step.is-done { color: var(--ink-2); }
.step.is-done .dot { background: var(--teal); border-color: var(--teal); color: #fff; }
.step.is-current { color: var(--ink); font-weight: 500; background: var(--wash); }
.step.is-current .dot { border: 1.5px solid var(--teal); color: var(--teal); }
.hint { font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; }
.hint em { font-family: var(--f-display); font-size: 17px; font-weight: 600; font-style: italic; color: var(--teal); }

/* ---------- App frame (sales and ops) ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: calc(100vh - 116px); }
.side { background: var(--paper); border-right: 1px solid var(--line); padding: 22px 16px; display: flex; flex-direction: column; gap: 26px; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.brand-sub { font: 500 10.5px/1 var(--f-ui); letter-spacing: .32em; text-transform: uppercase; color: var(--teal); padding-left: .32em; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 11px; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; font-size: 15px; color: var(--ink-2); text-align: left; }
.nav-item:hover { background: var(--wash); }
.nav-item[aria-current="page"] { background: var(--teal-deep); color: #fff; }
.nav-item .count { margin-left: auto; font: 500 12px var(--f-mono); padding: 1px 7px; border-radius: 999px; background: var(--wash); color: var(--ink); }
.nav-item[aria-current="page"] .count { background: rgba(255,255,255,.18); color: #fff; }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--wash); }
.me b { display: block; font-weight: 500; font-size: 14.5px; line-height: 1.2; }
.me small { display: block; font-size: 12.5px; color: var(--muted); }
.page { padding: 30px 32px 56px; display: flex; flex-direction: column; gap: 22px; min-width: 0; max-width: 1320px; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-size: 42px; line-height: 1.02; }
.page-head .sub { color: var(--ink-2); max-width: 62ch; font-size: 15.5px; }

.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); }
.framed { position: relative; }
.framed::after { content: ""; position: absolute; inset: 7px; border: 1px solid var(--teal); border-radius: calc(var(--r) - 6px); pointer-events: none; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--teal); color: #fff; font-weight: 500; font-size: 15.5px; letter-spacing: .02em; }
.btn:hover { background: var(--teal-deep); }
.btn-block { width: 100%; }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--paper); font-size: 14.5px; }
.btn-ghost:hover { border-color: var(--ink); }
.btn[disabled] { background: var(--line-2); cursor: not-allowed; }
.btn-ghost[disabled] { color: var(--muted); border-color: var(--line); cursor: default; }

.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 10.5px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.pill-kitchen { background: #ECEAE5; color: var(--ink-2); }
.pill-yes { border: 1px solid var(--ink); color: var(--ink); padding: 4px 8px; }
.pill-if { background: var(--if-wash); color: var(--if); }
.pill-no { background: var(--no-wash); color: var(--no); }
.pill-ops { border: 1px dashed var(--ink); color: var(--ink); padding: 4px 8px; }
.pill-quoted { background: var(--teal-deep); color: #fff; }
.pill-stale { border: 1px solid var(--no); color: var(--no); padding: 4px 8px; }
.pill-won { background: var(--teal); color: #fff; }
.pill-lost { border: 1px solid var(--line-2); color: var(--muted); padding: 4px 8px; }

/* ---------- New check ---------- */
.nc-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.form { padding: 26px; display: flex; flex-direction: column; gap: 22px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.input, .select, .textarea { width: 100%; min-height: 46px; border: 1px solid var(--line-2); border-radius: 10px; padding: 0 13px; background: var(--paper); font-size: 15.5px; font-weight: 400; color: var(--ink); }
.textarea { padding: 11px 13px; min-height: 70px; resize: vertical; line-height: 1.45; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(17,17,17,.08); }
.budget-box { padding: 22px 22px 20px; display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 8px 24px; align-items: center; }
.budget-box .field { gap: 8px; }
.req { font: 500 10px/1 var(--f-ui); letter-spacing: .18em; text-transform: uppercase; background: var(--teal); color: #fff; padding: 4px 6px; border-radius: 4px; margin-left: 8px; }
.money { display: flex; align-items: center; border: 1.5px solid var(--teal); border-radius: 12px; padding: 0 14px; height: 64px; background: var(--paper); }
.money span { font-family: var(--f-display); font-size: 34px; font-weight: 600; color: var(--teal); margin-right: 4px; }
.money input { border: 0; outline: none; width: 100%; font-family: var(--f-display); font-size: 38px; font-weight: 600; background: transparent; }
.money:focus-within { box-shadow: 0 0 0 3px rgba(17,17,17,.1); }
.money.has-err { border-color: var(--no); }
.budget-help { font-size: 14px; color: var(--ink-2); line-height: 1.45; }
.budget-help b { font-weight: 500; }
.err { color: var(--no); font-size: 13.5px; font-weight: 500; }
.form-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding-top: 4px; }
.nc-side { display: flex; flex-direction: column; gap: 20px; }
.bp { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.bp-bars { display: flex; flex-direction: column; gap: 10px; }
.bp-row { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 4.6em; gap: 10px; align-items: center; font-size: 13.5px; color: var(--ink-2); }
.bp-track { height: 12px; }
.bp-fill { display: block; height: 12px; border-radius: 0 4px 4px 0; transition: width .35s ease; }
.bp-row .mono { text-align: right; color: var(--ink); font-size: 13px; }
.bp-big { display: flex; flex-direction: column; gap: 2px; padding-top: 14px; border-top: 1px solid var(--line); }
.bp-big b { font-family: var(--f-display); font-weight: 600; font-size: 40px; line-height: 1; }
.bp-big span { font-size: 14px; color: var(--ink-2); }
.heads { padding: 20px 22px 8px; }
.head-item { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.head-item:first-of-type { border-top: 0; }
.tag { font: 500 10px/1 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; padding: 5px 0; border-radius: 4px; text-align: center; margin-top: 2px; }
.tag-clash { background: var(--no-wash); color: var(--no); }
.tag-watch { background: var(--if-wash); color: var(--if); }
.tag-ok { background: #EFEDE8; color: var(--ink-2); }
.tag-double { border: 1px solid var(--teal); color: var(--teal); padding: 4px 0; }
.repeat { background: var(--wash); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; font-size: 14.5px; }
.repeat b { font-weight: 500; }
.menu-b { border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; font-size: 14px; padding: 6px 0; border-top: 1px solid var(--line); }
.mrow .mc { display: block; margin-bottom: 1px; }
.mc { font: 500 10px/1.3 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mn em { font-style: normal; font: 500 9.5px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--teal); background: var(--teal-wash); padding: 3px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.mp { font-size: 12.5px; color: var(--ink-2); }
.swap { min-height: 34px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--paper); font-size: 12.5px; }
.swap:hover { border-color: var(--ink); }
.mtot { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 9px; margin-top: 2px; font-size: 14px; font-weight: 500; }
.mtot .over { color: var(--no); } .mtot .under { color: var(--teal); }
.chase { display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--ink-2); }
.mail { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); }
.mail b { font-family: var(--f-display); font-size: 20px; font-weight: 600; line-height: 1.1; color: var(--ink); }
.mail > span { font-size: 13px; color: var(--muted); }
.chip-s { display: inline-flex; align-items: center; min-height: 30px; font-size: 12.5px; cursor: default; }
.stack { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; min-width: 140px; margin-bottom: 5px; }
.stack i { display: block; }
.sig { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
.sig:first-of-type { border-top: 0; }
.sig b { font-weight: 500; font-size: 15px; }
.sig p { font-size: 14px; color: var(--ink-2); }
.head-item b { display: block; font-weight: 500; font-size: 14.5px; }
.head-item span.s { display: block; font-size: 13.5px; color: var(--muted); }

/* ---------- Inbox ---------- */
.inbox { display: grid; grid-template-columns: 296px minmax(0, 1fr) 344px; gap: 16px; align-items: start; }
.list { padding: 16px 8px 8px; display: flex; flex-direction: column; gap: 8px; }
.list-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 10px 6px; }
.list-head h2 { font-size: 26px; }
.items { display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; flex-direction: column; gap: 6px; border: 0; background: transparent; text-align: left; padding: 12px 12px; border-radius: 12px; }
.item:hover { background: var(--wash); }
.item[aria-current="true"] { background: var(--canvas); box-shadow: inset 0 0 0 1px var(--line-2); }
.item-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.item-top b { font-weight: 500; font-size: 15px; }
.item-top span { font: 400 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.item-sub { display: flex; gap: 8px; align-items: center; min-width: 0; }
.item-sub .t { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.new-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); flex-shrink: 0; }

.thread { display: flex; flex-direction: column; min-height: 640px; overflow: hidden; }
.thread-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.thread-head h2 { font-size: 28px; line-height: 1.05; }
.thread-head p { font-size: 13.5px; color: var(--muted); }
.msgs { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 14px; background: var(--wash); overflow-y: auto; max-height: 640px; }
.msgs > :first-child, .sms-list > :first-child { margin-top: auto; }
.msg { max-width: 78%; padding: 11px 14px; border-radius: 18px; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; gap: 4px; }
.msg .time { font: 400 11.5px var(--f-mono); color: var(--muted); }
.msg-me { align-self: flex-end; background: var(--teal-deep); color: #fff; border-radius: 18px 18px 6px 18px; }
.msg-me .time { color: #A9CFCA; align-self: flex-end; }
.msg-row { display: flex; gap: 10px; align-items: flex-end; max-width: 86%; }
.msg-them { background: var(--paper); border: 1px solid var(--line); border-radius: 18px 18px 18px 6px; }
.msg-sys { align-self: center; font-size: 13px; color: var(--muted); display: inline-flex; gap: 8px; align-items: center; text-align: center; padding: 0 10px; }
.msg-sys::before, .msg-sys::after { content: ""; width: 24px; height: 1px; background: var(--line-2); }
.chef-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 9px; position: relative; min-width: 0; }
.chef-card::after { content: ""; position: absolute; inset: 5px; border: 1px solid var(--teal); border-radius: 11px; pointer-events: none; }
.ans-tag { align-self: flex-start; font: 600 11px/1 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; }
.ans-yes { background: var(--yes); color: #fff; }
.ans-if { background: var(--if); color: #fff; }
.ans-no { background: var(--no); color: #fff; }
.because { font-size: 13.5px; color: var(--muted); }
.because b { font-weight: 500; color: var(--ink-2); }
.conds { display: flex; flex-direction: column; gap: 6px; }
.conds li { display: flex; gap: 8px; font-size: 15px; line-height: 1.4; }
.conds svg { flex-shrink: 0; margin-top: 3px; }
.voice { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-2); background: var(--wash); border-radius: 999px; padding: 5px 11px 5px 6px; align-self: flex-start; }
.voice .play { width: 22px; height: 22px; border-radius: 50%; background: var(--teal); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
.voice .wave { display: inline-flex; gap: 2px; align-items: center; }
.voice .wave i { display: block; width: 2px; background: var(--ink-2); border-radius: 1px; }
.chef-quote { font-family: var(--f-display); font-style: italic; font-size: 18px; line-height: 1.35; color: var(--ink); }
.composer { padding: 12px 14px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; background: var(--paper); }
.composer .input { border-radius: 999px; padding: 0 18px; background: var(--wash); border-color: var(--line); }
.icon-btn { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--teal); color: #fff; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

.deal { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.deal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.deal-head h3 { font-size: 24px; line-height: 1.1; margin-top: 4px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.facts div { padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.facts div + div { border-left: 1px solid var(--line); }
.facts dt { font-size: 11.5px; color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; }
.block { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14.5px; }
.row small { display: block; font-size: 12.5px; color: var(--muted); }
.menu-lines { display: flex; flex-direction: column; gap: 5px; font-size: 14.5px; color: var(--ink-2); padding-left: 14px; border-left: 1px solid var(--line-2); }
.menu-lines li em { white-space: nowrap; font-style: normal; font: 500 10px/1 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--teal); background: var(--teal-wash); padding: 3px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
.switch { width: 46px; height: 28px; border-radius: 14px; border: 0; padding: 3px; background: var(--line-2); display: inline-flex; flex-shrink: 0; transition: background .2s ease; }
.switch span { width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s ease; }
.switch[aria-checked="true"] { background: var(--teal); }
.switch[aria-checked="true"] span { transform: translateX(18px); }
.total { background: var(--teal-deep); color: #fff; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.total-top { display: flex; justify-content: space-between; align-items: baseline; }
.total-top b { font-family: var(--f-display); font-weight: 600; font-size: 36px; line-height: 1; }
.total-top span { font-size: 13px; color: #B5B2AC; }
.meter { position: relative; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--teal-light); transition: width .35s ease; }
.meter .over { background: #E9897F; }
.meter b { position: absolute; top: -5px; bottom: -5px; width: 2px; background: #F3F2EF; }
.total p { font-size: 13.5px; color: #CFCCC5; line-height: 1.45; }
.state { border: 1px dashed var(--line-2); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--wash); }
.state h4 { font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.1; }
.state p { font-size: 14px; color: var(--ink-2); }
.outcomes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.outcomes button { min-height: 46px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--paper); font-size: 14.5px; font-weight: 500; }
.outcomes button:hover { border-color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 38px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--paper); font-size: 14px; color: var(--ink-2); }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--teal-deep); border-color: var(--teal-deep); color: #fff; }

/* ---------- Chef stage and phone ---------- */
.stage { min-height: calc(100vh - 116px); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 40px 64px; padding: 36px 24px 48px; background: radial-gradient(1200px 600px at 50% 0%, #E9F5F2 0%, var(--canvas) 70%); }
.phone { width: 392px; max-width: 100%; height: 800px; border-radius: 52px; background: var(--ink); padding: 11px; box-shadow: 0 2px 0 #333 inset, 0 40px 80px -30px rgba(17,17,17,.45), 0 12px 24px -12px rgba(17,17,17,.3); flex-shrink: 0; }
.screen { height: 100%; border-radius: 42px; background: var(--paper); overflow: hidden; display: flex; flex-direction: column; position: relative; }
.ph-head { padding: 26px 18px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); background: var(--teal-wash); }
.ph-av { width: 56px; height: 56px; border-radius: 50%; background: #fff; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
.ph-head b { font-weight: 500; font-size: 15px; }
.ph-head small { font-size: 12px; color: var(--muted); margin-top: -6px; }
.ph-body { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; }
.sms-list { background: var(--paper); }
.sms-day { align-self: center; font-size: 11.5px; color: var(--muted); }
.sms { align-self: flex-start; max-width: 86%; background: #EDEBE6; border-radius: 20px 20px 20px 6px; padding: 10px 13px; font-size: 15px; line-height: 1.42; display: flex; flex-direction: column; gap: 9px; }
.sms.dim { opacity: .6; }

  function quoteBuilder(c) {
    var a = c.answer;
    var menu = a.menu || (c.menus && c.menus[a.kind]) || { lines: [['Chef’s menu to budget']], price: Math.max(0, c.budget - COFFEE) };
    var q = menu.price + (c.coffee ? COFFEE : 0);
    var pct = q / c.budget;
    var fixes = a.fixes.concat(a.custom ? [a.custom] : []);
    var conds = (a.swaps || []).map(function (x) { return 'Menu: ' + x; }).concat(fixes);
    var extra = fixes.reduce(function (sum, f) { var m = f.match(/= £([\d,]+)/) || f.match(/· £([\d,]+)/); return sum + (m ? parseFloat(m[1].replace(/,/g, '')) : 0); }, 0);
    var note;
    if (q > c.budget + 0.75) note = 'Over budget by ' + gbp2(q - c.budget) + ' a head. Check with the client, or ask the head chef for a swap.';
    else if (c.budget - q > 0.5) note = gbp2(c.budget - q) + ' a head is still in the budget. Ask the head chef to add something.';
    else note = 'Uses the whole budget.' + (fixes.some(function (f) { return /£/.test(f); }) ? ' Covers the costs the head chef flagged.' : '');
    var meterW = Math.min(pct, 1.25) / 1.25 * 100;

      '<div class="row"><span>Menu</span><span class="mono">' + gbp2(menu.price) + '</span></div>' +

      (extra > 0 ? '<div class="row" style="background:var(--if-wash);border-radius:10px;padding:10px 12px;color:#5E3700"><span>Extra costs the head chef flagged<small style="color:#7A4A00">Price them in, or they come out of the margin</small></span><b class="mono" style="font-weight:500;white-space:nowrap">' + gbp(extra) + ' · ' + gbp2(extra / c.covers) + '/head</b></div>' : '') +
      '<div class="total"><div class="total-top"><span>Quote, per head</span><b>' + gbp2(q) + '</b></div>' +
      '<div class="meter" aria-hidden="true"><i class="' + (q > c.budget + 0.75 ? 'over' : '') + '" style="width:' + meterW.toFixed(1) + '%"></i><b style="left:' + (1 / 1.25 * 100).toFixed(1) + '%"></b></div>' +
      '<p>' + gbp(q * c.covers) + ' for ' + c.covers + '. ' + note + '</p></div>' +
      '<button type="button" class="btn btn-block" data-act="sendQuote" data-arg="' + c.id + '">Send quote to client ' + I.arrow + '</button></div>';

  function answerScreen() {

        '<input class="input" id="ad-custom" data-ad="custom" placeholder="Something else? Type it here" aria-label="Another condition" value="' + esc(a.custom) + '"></div>';

      more += '<p class="notice" style="background:var(--teal-wash);color:var(--teal-ink)">Sales quotes this menu. You’ll get a text if it’s booked.</p>';

      '<p class="muted" style="font-size:13.5px;margin-top:6px">' + (mw >= aw ? 'A modified menu books at least as often as a straight accept. Every decline that could have been a modification is money left behind.' : 'Modified jobs book a little less often, but they still book, unlike a decline.') + '</p></section>';

    return '<div class="page-head"><p class="label">Trends · since 4 January · example data</p><h1 class="display">What the kitchen turns down, and why</h1><p class="sub">Accepts, modifications and declines over time, the reasons behind them, and the requests that keep coming back. ' + siteName() + '.</p></div>' +
      '<div class="ops-top">' + siteSeg() + '</div>' + kpis + weekly +
      '<div class="lg-grid">' + heat + '<section class="card why" aria-label="What the trends say"><h2 class="display" style="font-size:26px;margin-bottom:4px">What the trends say</h2>' + insights().map(insightHtml).join('') + '</section></div>' +
      '<div class="lg-grid lower">' + reasonsHm + pays + '</div>' + reqTable;
  }

  /* ---------------- Actions ---------------- */
  function toast(msg) {
    var old = document.querySelector('.toast');
    if (old) old.remove();

    t.className = 'toast';
    t.setAttribute('role', 'status');
    t.innerHTML = I.check + '<span>' + esc(msg) + '</span>';
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 2800);
  }
  function chefOutcomeSystem(c) {
    if (c.answer && c.answer.kind === 'if' && c.status === 'won') c.msgs.push({ from: 'system', text: 'The head chef was texted: their modified menu won ' + gbp(value(c)) });
  }

  var A = {
    role: function (r) {
      S.role = r;
      var c = c42();
      if (r === 'ops' && S.opsView === 'trends' && c && (c.status === 'won' || c.status === 'lost')) S.opsSeenAfter = true;
      if (r === 'chef' && S.phone === 'answer' && S.checks[S.phoneCheck] && S.checks[S.phoneCheck].status !== 'kitchen') S.phone = 'done';
    },
    reset: function () { S = initial(); S.intro = false; toast('Demo reset. The tour starts again'); },
    intro: function () { S.intro = true; },
    opsView: function (v) {
      S.opsView = v; S.openDec = null;
      var c = c42();
      if (v === 'trends' && c && (c.status === 'won' || c.status === 'lost')) S.opsSeenAfter = true;
    },
    site: function (v) { S.site = v; S.openDec = null; S.decLimit = 20; },
    decKind: function (v) { S.decKind = v; S.openDec = null; S.decLimit = 20; },
    decReason: function (v) { S.decReason = v || ''; S.openDec = null; S.decLimit = 20; },
    decReq: function (v) { S.decReq = v || ''; S.openDec = null; },
    openDec: function (k) { S.openDec = S.openDec === k ? null : k; },
    moreDec: function () { S.decLimit += 20; },
    drill: function (arg) {
      var p = String(arg || '').split('|');
      S.role = 'ops'; S.opsView = 'decisions'; S.openDec = null; S.decLimit = 20;
      S.site = p[0] || 'all'; S.decKind = p[1] || 'all'; S.decReason = p[2] || ''; S.decReq = p[3] || '';
    },
    tour: function () { S.intro = false; S.coach = true; S.role = 'sales'; S.salesView = c42() ? 'inbox' : 'new'; },
    explore: function () { S.intro = false; S.coach = false; },
    step: function (i) {
      steps()[+i].go();
      var c = c42();
      if (S.role === 'ops' && S.opsView === 'trends' && c && (c.status === 'won' || c.status === 'lost')) S.opsSeenAfter = true;
    },
    salesView: function (v) { S.salesView = v; },
    select: function (id) { S.salesView = 'inbox'; S.selected = id; S.lostOpen = null; if (S.checks[id]) S.checks[id].unread = false; },
    sendCheck: function () {
      var d = S.draft;
      var b = parseFloat(String(d.budget).replace(/[£,\s]/g, ''));
      if (!(b > 0)) { S.draftError = true; return; }
      var covers = parseInt(d.covers, 10) || 120;
      var t = tick();
      var lob = /lobster/i.test(d.asks);
      var c = {
        id: '0142', title: (SHORT[d.service] || 'Event') + ' for ' + covers, client: d.client, date: d.date, time: d.time, covers: covers, service: d.service,
        budget: b, asks: d.asks || 'Nothing special', note: d.note, due: d.due, status: 'kitchen', updated: t, coffee: true, unread: false,
        heads: [['clash', 'You’re off 14–16 May', 'A cover chef would be needed. Agency rate £35 an hour.'], ['double', 'Board breakfast the same morning', 'Pair them: shared prep and staff. The combi is free from 11:00.'], ['ok', 'Stock to push: chicken thigh', '20 kg, use by 16 May'], ['ok', 'Fork bowls: 160 in stock', 'Enough for ' + covers + ' covers']].concat(historyFor(d.asks) ? [['history-chef', d.asks]] : []),
        fixOptions: ['+1 cover chef, 6 h × £35 = £210', 'Pair with the board breakfast: shared prep, +1 agency staff'],
        courses: [{ c: 'Main', o: lob ? [['Lobster, herb butter, new potatoes', 22, 'as asked'], ['Hot-smoked salmon, crushed new potatoes', 11.5]] : [['Hot-smoked salmon, crushed new potatoes', 11.5], ['Roast cod, crushed new potatoes', 12]] }, { c: 'Second main', o: [['Chicken thigh, salsa verde', 7, 'stock to push'], ['Roast squash, lentils', 6.5]] }, { c: 'Side', o: [['Seasonal greens', 2.5]] }, { c: 'Dessert', o: [['Lemon posset', 6], ['Chocolate délice', 7]] }],
        picks: { yes: [0, 0, 0, 0], if: lob ? [1, 0, 0, 0] : [0, 0, 0, 0] },
        msgs: [
          { from: 'sales', text: (SHORT[d.service] || 'Event') + ' for ' + covers + ' on ' + d.date + ', ' + d.service.toLowerCase() + ', ' + gbp2(b) + ' a head. They want ' + (d.asks || 'nothing special').toLowerCase() + '. ' + (d.note ? d.note : ''), time: t },
          { from: 'system', text: 'Sent to the head chef by text at ' + t }
        ]
      };
      S.checks['0142'] = c;
      S.order.unshift('0142');
      S.selected = '0142';
      S.salesView = 'inbox';
      S.draftError = false;
      toast('Sent to the head chef by text');
    },
    nudge: function () { toast('Head chef nudged by text'); },
    openSms: function (id) { openCheck(id); },
    phoneBack: function () { S.phone = 'messages'; S.adError = false; },
    pickAnswer: function (k) {
      if (S.ad.kind !== k) { S.scrollPhone = true; var c = S.checks[S.phoneCheck]; S.ad.picks = c.picks && c.picks[k] ? c.picks[k].slice() : null; }
      S.ad.kind = k; S.adError = false;
    },
    swap: function (i) { var c = S.checks[S.phoneCheck]; i = +i; S.ad.picks[i] = (S.ad.picks[i] + 1) % c.courses[i].o.length; },
    openNotes: function () { S.phone = 'notes'; S.phoneCheck = null; },
    note: function (i) { S.notes[+i].on = !S.notes[+i].on; },
    saveNotes: function () {

    },
    approveFixes: function () {

      S.approved = S.approved.concat(add);
      var cost = FIXES.filter(function (f) { return add.indexOf(f.id) > -1; }).reduce(function (sum, f) { return sum + f.cost; }, 0);
      toast('Approved ' + gbp(cost) + ' of fixes. The head chef has been told by text');
    },
    digest: function () { S.digestSent = true; toast('Sent to you and your boss. It goes every Monday'); },
    reason: function (r) { S.ad.reasons = toggleIn(S.ad.reasons, r); S.adError = false; },
    fix: function (i) { var c = S.checks[S.phoneCheck]; S.ad.fixes = toggleIn(S.ad.fixes, c.fixOptions[+i]); S.adError = false; },
    voice: function () { S.ad.voice = !S.ad.voice; },
    sendAnswer: function () {
      var c = S.checks[S.phoneCheck], a = S.ad;
      if (!a.kind) return;
      if (a.kind !== 'yes' && !a.reasons.length) { S.adError = 'Tap at least one reason so sales and the GM know why.'; return; }
      var swaps = a.kind === 'no' ? [] : swapsOf(c, a.picks);
      if (a.kind === 'if' && !a.fixes.length && !a.custom.trim() && !swaps.length) { S.adError = 'Swap a dish, tick what would make it a yes, or type it.'; return; }
      var t = tick();
      var menu = a.kind === 'no' ? null : menuOf(c, a.picks);
      c.answer = { kind: a.kind, reasons: a.reasons.slice(), fixes: a.fixes.slice(), custom: a.custom.trim(), voice: a.voice, note: '', menu: menu, swaps: swaps };
      c.msgs.push({ from: 'chef', kind: a.kind, reasons: c.answer.reasons, fixes: c.answer.fixes, custom: c.answer.custom, voice: a.voice, menu: menu, swaps: swaps, time: t });
      if (a.kind === 'no' && value(c) >= ESCALATE_AT) {
        c.status = 'ops';
        c.msgs.push({ from: 'system', text: 'Over £5,000, so it went to the GM first' });
      } else {
        c.status = 'answered';
      }
      c.updated = t;
      c.unread = true;
      S.phone = 'done';
      S.adError = false;
    },
    coffee: function (id) { var c = S.checks[id]; c.coffee = !c.coffee; },
    sendQuote: function (id) {
      var c = S.checks[id], menu = c.answer.menu || (c.menus && c.menus[c.answer.kind]) || { price: Math.max(0, c.budget - COFFEE) };
      c.quote = menu.price + (c.coffee ? COFFEE : 0);
      c.status = 'quoted';
      c.updated = tick();
      c.msgs.push({ from: 'system', text: 'Quote sent: ' + gbp2(c.quote) + ' a head, ' + gbp(value(c)) });
      toast('Quote sent to the client');
    },
    sendMsg: function (id) {
      var el = document.getElementById('msg-input');
      var v = el ? el.value.trim() : '';
      if (!v) return;
      var c = S.checks[id];
      c.msgs.push({ from: 'sales', text: v, time: tick() });
    },
    won: function (id) {
      var c = S.checks[id];
      c.status = 'won'; c.stale = false; c.updated = tick(); c.lostWhy = '';
      c.msgs.push({ from: 'system', text: 'Won: ' + gbp(value(c)) + ', booked' });
      chefOutcomeSystem(c);
      S.live.push({ type: 'won', title: c.title, date: c.date, value: value(c), why: c.answer && c.answer.kind === 'if' ? 'Booked. Started as a modified menu.' : 'Booked.' });
      S.flashWon = true; S.lostOpen = null;
      toast('Marked won. The GM’s ledger is updated');
    },
    lostOpen: function (id) { S.lostOpen = S.lostOpen === id ? null : id; },
    lostWhy: function (r) { closeClient(S.lostOpen, r); },
    noReply: function (id) { closeClient(id, 'No reply'); },
    closeKitchen: function (id) {
      var c = S.checks[id];
      c.status = 'lost'; c.updated = tick(); c.lostWhy = 'Kitchen: ' + c.answer.reasons.join(', ');
      c.msgs.push({ from: 'system', text: 'Closed as lost. The head chef’s reasons go to the ledger' });
      S.live.push({ type: 'kitchen', title: c.title, date: c.date, value: value(c), reasons: c.answer.reasons.slice(), why: c.answer.reasons.join(', ') });
      toast('Closed as lost, with the head chef’s reasons');
    },
    askOps: function (id) {
      var c = S.checks[id];
      c.status = 'ops'; c.updated = tick();
      c.msgs.push({ from: 'system', text: 'Sent to the GM to review' });
      toast('Sent to the GM');
    },
    opsApprove: function (id) {
      var c = S.checks[id], t = tick();
      c.answer = { kind: 'if', reasons: c.answer.reasons, fixes: c.fixOptions.slice(), custom: '', voice: false, approved: true, menu: c.courses ? menuOf(c, c.picks.if) : null, swaps: [] };
      if (!c.answer.menu && !(c.menus && c.menus.if)) { c.menus = c.menus || {}; c.menus.if = { lines: [['Chef’s menu to budget']], price: Math.max(0, c.budget - COFFEE) }; }
      c.status = 'answered'; c.updated = t; c.unread = true;
      c.msgs.push({ from: 'ops', text: 'Approved: ' + c.fixOptions.join('; ') + '. Sales, quote it with those costs in.', time: t });
      toast('Approved. Back to sales to quote');
    },
    opsDecline: function (id) {
      var c = S.checks[id];
      c.status = 'lost'; c.updated = tick(); c.lostWhy = 'Kitchen: ' + c.answer.reasons.join(', ');
      c.msgs.push({ from: 'system', text: 'The GM let the decline stand. Logged with the head chef’s reasons' });
      S.live.push({ type: 'kitchen', title: c.title, date: c.date, value: value(c), reasons: c.answer.reasons.slice(), why: c.answer.reasons.join(', ') + '. The GM let the decline stand.' });
      toast('Logged as lost, with the reasons');
    },
    pickFix: function (id) { S.picked = toggleIn(S.picked, id); },
    noop: function () {}
  };
  function closeClient(id, why) {
    var c = S.checks[id];
    if (!c) return;
    c.status = 'lost'; c.stale = false; c.updated = tick(); c.lostWhy = 'Client: ' + why;
    c.msgs.push({ from: 'system', text: 'Lost: ' + why.toLowerCase() });

    toast('Logged as lost: ' + why.toLowerCase());
  }

  /* ---------------- Render and events ---------------- */
  function viewKey() {
    return S.role + '|' + (S.role === 'sales' ? S.salesView + (S.salesView === 'inbox' ? S.selected : '') : S.role === 'chef' ? '' : S.opsView);
  }
  function render() {

    S.animate = vk !== S.lastView;
    var phoneKey = S.phone + S.phoneCheck;
    var animatePhone = S.role === 'chef' && phoneKey !== S.lastPhone && !S.animate;
    var oldPh = app.querySelector('.ph-body');
    var phTop = oldPh ? oldPh.scrollTop : 0;
    var samePhone = oldPh && oldPh.getAttribute('data-screen') === S.phone + S.phoneCheck;
    app.innerHTML = shell();
    S.lastView = vk;
    S.lastPhone = phoneKey;
    if (S.role === 'ops') S.flashWon = false;
    if (animatePhone) { var scr = app.querySelector('.screen'); if (scr) scr.classList.add('enter-ph'); }
    var sel = coachTarget();
    if (sel) {
      var tgt = app.querySelector(sel);
      if (tgt) {
        tgt.classList.add('coach');
        if (sel !== S.lastCoach) {
          setTimeout(function () {
            var r = tgt.getBoundingClientRect();

            else if (tgt.closest('.ph-body')) tgt.scrollIntoView({ block: 'nearest' });
          }, 60);
        }
      }

    if (S.intro) { var tb = document.getElementById('tour-btn'); if (tb) tb.focus(); }
    var msgs = app.querySelector('.msgs');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
    var body = app.querySelector('.ph-body');
    if (body) {
      body.setAttribute('data-screen', S.phone + S.phoneCheck);
      if (S.scrollPhone) { body.scrollTop = Math.max(0, body.scrollHeight - body.clientHeight - 40); S.scrollPhone = false; }
      else if (S.phone === 'messages') body.scrollTop = body.scrollHeight;
      else if (samePhone) body.scrollTop = phTop;
    }
    window.scrollTo(0, y);
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || !app.contains(el)) return;
    var act = el.getAttribute('data-act');
    if (!A[act]) return;
    var prevRole = S.role;
    A[act](el.getAttribute('data-arg'));
    render();
    if (S.role !== prevRole) window.scrollTo(0, 0);
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'check-form') { e.preventDefault(); A.sendCheck(); render(); if (c42()) window.scrollTo(0, 0); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    var k = t.getAttribute('data-draft');
    if (k) {
      S.draft[k] = t.value;
      if (k === 'budget' || k === 'covers') {
        var p = document.getElementById('budget-panel');
        if (p) p.innerHTML = budgetPanel();
      }
      if (k === 'budget' && S.draftError && parseFloat(t.value) > 0) {
        S.draftError = false;
        var er = document.getElementById('budget-err'); if (er) er.hidden = true;
        var m = document.getElementById('money'); if (m) m.classList.remove('has-err');
      }
      return;
    }
    if (t.getAttribute('data-ad') === 'custom') { S.ad.custom = t.value; }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.intro) { A.explore(); render(); return; }
    if (e.key === 'Enter' && e.target && e.target.id === 'msg-input') {
      e.preventDefault();
      A.sendMsg(S.selected);
      render();
      var el = document.getElementById('msg-input'); if (el) el.focus();
    }
  });

  render();
})();
